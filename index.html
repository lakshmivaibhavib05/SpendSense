<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendSense</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 24px;
    }

    h1 {
      color: #2563eb;
      margin-bottom: 8px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      margin-top: 24px;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>SpendSense</h1>
    <p>Your simple daily expense tracker.</p>

    <section class="card">
      <h2>Add an expense</h2>

      <input id="amount" type="number" placeholder="Amount (for example, 150)" />

      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Other</option>
      </select>

      <button onclick="addExpense()">Add Expense</button>

      <p id="message"></p>
    </section>
  </main>

  <script>
    function addExpense() {
      const amount = document.getElementById("amount").value;
      const category = document.getElementById("category").value;
      const message = document.getElementById("message");

      if (amount === "" || Number(amount) <= 0) {
        message.textContent = "Please enter a valid amount.";
        message.style.color = "crimson";
        return;
      }

      message.textContent = `Added ₹${amount} for ${category}.`;
      message.style.color = "green";
      document.getElementById("amount").value = "";
    }
  </script>
</body>
</html>
